<!DOCTYPE html>
<html lang="de">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
    <style>
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --muted: #6b6b6b;
    --rule: #e2e2e2;
    --soft: #f4f4f4;
    --gold: #b8901f;
    --gold-tint: #f7f0dc;
    --silver: #8e959c;
    --silver-tint: #eef0f2;
    --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 64px;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* Kopf */
  .masthead { background: var(--ink); color: var(--paper); }
  .masthead-inner { max-width: 560px; margin: 0 auto; padding: 16px 16px 28px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  }
  .brand img { display: block; height: 44px; width: auto; filter: invert(1); }
  .season-tag {
    padding: 5px 10px;
    border: 1px solid var(--paper);
    font-size: 13px; font-weight: 700;
  }
  .title {
    margin: 22px 0 0;
    font-size: 52px;
    line-height: 0.9;
    font-weight: 900;
    font-stretch: 62%;
    letter-spacing: -0.01em;
  }
  .matchday { margin-top: 16px; }
  .matchday p { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
  .matchday p span { font-weight: 400; opacity: 0.65; }
  .season-bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 0; padding: 0; list-style: none; }
  .season-bar li { height: 6px; background: rgba(255, 255, 255, 0.22); }
  .season-bar li.played { background: var(--paper); }
  .season-bar li.current { background: var(--gold); }

  /* Abschnitte */
  .block { margin-top: 40px; }
  .block h2 {
    margin: 0 0 14px;
    font-size: 26px;
    font-weight: 800;
    font-stretch: 75%;
  }
  .lead { margin: -6px 0 16px; color: var(--muted); }
  .status { margin-top: 32px; color: var(--muted); }

  /* Tabelle */
  .standings {
    position: relative;
    margin: -12px -4px 0;
    background: var(--paper);
    border: 2px solid var(--ink);
  }
  .table-head {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 12px;
    padding: 8px 12px 8px 0;
    background: var(--ink); color: var(--paper);
    font-size: 12px; font-weight: 700;
  }
  .table-head span:first-child { text-align: center; }
  .table { list-style: none; margin: 0; padding: 0; }
  .row { position: relative; border-bottom: 1px solid var(--rule); }
  .row:last-child { border-bottom: 0; }
  .race {
    position: absolute; left: 0; bottom: 0;
    height: 3px; width: var(--w);
    background: var(--ink); opacity: 0.12;
  }
  .row.gold .race { background: var(--gold); opacity: 1; }
  .row.silver .race { background: var(--silver); opacity: 1; }
  .zone {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border-top: 2px dashed var(--ink);
    font-size: 12px; font-weight: 700;
  }
  .zone::before { content: '▲'; font-size: 9px; }
  .row-button {
    width: 100%;
    display: grid;
    grid-template-columns: 52px 44px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 14px 12px 14px 0;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .row-button:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }

  .rank {
    font-size: 46px;
    line-height: 1;
    font-weight: 900;
    font-stretch: 62%;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .row.gold { background: var(--gold-tint); box-shadow: inset 6px 0 0 var(--gold); }
  .row.silver { background: var(--silver-tint); box-shadow: inset 6px 0 0 var(--silver); }
  .row.gold .rank { color: var(--gold); }
  .row.silver .rank { color: var(--silver); }

  .logo {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--paper);
    display: grid; place-items: center;
    overflow: hidden;
    font-weight: 800; font-size: 13px; font-stretch: 75%;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }

  .team { min-width: 0; }
  .team-name { display: block; font-weight: 700; font-size: 17px; line-height: 1.2; }
  .team-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: 13px; color: var(--muted); }
  .move-up { color: var(--ink); font-weight: 700; }
  .move-down { color: var(--muted); }

  .points { text-align: right; }
  .points strong {
    display: block;
    font-size: 30px; line-height: 1;
    font-weight: 900; font-stretch: 75%;
    font-variant-numeric: tabular-nums;
  }
  .points small { font-size: 12px; color: var(--muted); }

  .breakdown {
    margin: 0 0 14px 64px;
    padding: 0 8px 0 0;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    font-size: 14px;
  }
  .breakdown[hidden] { display: none; }
  .breakdown dt { color: var(--muted); }
  .breakdown dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  .legend { margin: 0; padding: 10px 12px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }

  /* Gewinne */
  .prize { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--rule); }
  .prize:first-child { border-top: 1px solid var(--ink); }
  .prize .rank { font-size: 40px; }
  .prize.gold .rank { color: var(--gold); }
  .prize.silver .rank { color: var(--silver); }
  .prize p { margin: 0; }
  .teaser { padding: 18px; border: 2px dashed var(--ink); font-weight: 600; }

  /* Regelwerk */
  .rule { padding: 16px 0; border-top: 1px solid var(--rule); }
  .rule:first-child { border-top: 1px solid var(--ink); }
  .rule h3 { margin: 0; font-size: 18px; font-weight: 700; }
  .tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 10px 0; padding: 0; list-style: none; }
  .tiers li { padding: 6px 4px; background: var(--soft); text-align: center; font-size: 13px; line-height: 1.2; }
  .tiers li:last-child { background: var(--ink); color: var(--paper); }
  .tiers b { display: block; font-size: 16px; font-stretch: 75%; font-weight: 800; }
  .rule p { margin: 0; color: var(--muted); font-size: 15px; }

  /* Saisonverlauf */
  .history-scroll { overflow-x: auto; border-top: 1px solid var(--ink); }
  .history { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  .history th, .history td { padding: 8px 6px; border-bottom: 1px solid var(--rule); text-align: center; white-space: nowrap; }
  .history th:first-child { text-align: left; position: sticky; left: 0; background: var(--paper); font-weight: 700; }
  .history thead th { color: var(--muted); font-weight: 400; }
  .history td.best { font-weight: 800; }
  .history td.empty { color: var(--rule); }

  /* Login */
  .login { margin-top: 40px; }
  .login-form { display: grid; gap: 10px; }
  .login-form label { font-weight: 600; }
  .login-form input {
    font: inherit; font-size: 18px;
    padding: 12px; border: 2px solid var(--ink); border-radius: 0;
  }
  .login-form input:focus-visible, .login-form button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .login-form button {
    font: inherit; font-weight: 800; font-size: 18px;
    padding: 14px; border: 0; border-radius: 0;
    background: var(--ink); color: var(--paper); cursor: pointer;
  }
  .error { margin: 0; color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: no-preference) {
    .table.reveal .row { animation: rise 420ms cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 70ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  }
</style>

  </head>

  (function () {
    var STORAGE_KEY = 'lipptaste-league-password';
    var $ = function (id) { return document.getElementById(id); };

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function storedPassword() {
      try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (e) { return ''; }
    }
    function storePassword(pw) {
      try { pw ? localStorage.setItem(STORAGE_KEY, pw) : localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    }

    function initials(name) {
      return name.split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 3).toUpperCase();
    }

    function logo(team) {
      return team.logoUrl
        ? '<span class="logo"><img src="' + esc(team.logoUrl) + '" alt=""></span>'
        : '<span class="logo" aria-hidden="true">' + esc(initials(team.name)) + '</span>';
    }

    function movement(team) {
      if (team.movement > 0) return '<span class="move-up">▲ ' + team.movement + (team.movement === 1 ? ' Platz' : ' Plätze') + '</span>';
      if (team.movement < 0) return '<span class="move-down">▼ ' + Math.abs(team.movement) + (team.movement === -1 ? ' Platz' : ' Plätze') + '</span>';
      return '';
    }

    function renderHeader(league) {
      $('season-tag').textContent = 'Saison ' + league.season;

      var current = league.currentMonth;
      var bar = '';

        bar += '<li class="' + (m < current ? 'played' : m === current ? 'current' : '') + '"></li>';
      }
      var md = $('matchday');
      md.hidden = false;
      md.innerHTML = '<p>' + (current > 0
          ? 'Spieltag ' + current + ' von 12 <span>' + esc(league.currentMonthName) + '</span>'
          : 'Anpfiff im Januar ' + esc(league.season)) + '</p>' +
        '<ol class="season-bar" aria-hidden="true">' + bar + '</ol>';
    }

        var width = started && leader > 0 ? Math.round((t.total / leader) * 100) : 0;
        var meta = [];
        if (started) meta.push('+' + t.currentMonthPoints + ' im ' + esc(league.currentMonthName));
        if (t.isCurrentMonthWinner) meta.push('<span class="move-up">Spieltagssieger</span>');
        if (t.monthWins > 0) meta.push('👑 ' + t.monthWins + '×');
        var mv = movement(t);
        if (mv) meta.push(mv);

        var breakdown = started
          ? '<dl class="breakdown" id="bd-' + i + '" hidden>' + league.disciplines.map(function (d) {
              return '<dt>' + esc(d.label) + '</dt><dd>' + t.totalsByDiscipline[d.key] + '</dd>';
            }).join('') + '</dl>'
          : '';

        return '<li class="row' + (t.medal ? ' ' + t.medal : '') + '" style="--i:' + i + '">' +
          '<button class="row-button" type="button"' + (started ? ' aria-expanded="false" aria-controls="bd-' + i + '"' : ' disabled') + '>' +
            (started
              ? '<span class="rank" aria-label="Platz ' + t.rank + '">' + t.rank + '</span>'
              : '<span class="rank" aria-hidden="true">–</span>') +
            logo(t) +
            '<span class="team"><span class="team-name">' + esc(t.name) + '</span>' +
              (meta.length ? '<span class="team-meta">' + meta.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</span>' : '') +
            '</span>' +
            '<span class="points"><strong>' + t.total + '</strong>' + gap + '</span>' +
          '</button>' + breakdown +
          (width ? '<span class="race" style="--w:' + width + '%"></span>' : '') +
          '</li>' + zone;
      }).join('');

      $('legend').textContent = started
        ? 'Tippe auf einen Standort, um zu sehen, aus welchen Disziplinen die Punkte kommen.'
        : 'Ab Januar sammelt jeder Standort jeden Monat Punkte. Platz 1 und 2 gewinnen.';

      Array.prototype.forEach.call(document.querySelectorAll('.row-button[aria-controls]'), function (btn) {
        btn.addEventListener('click', function () {
          var open = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!open));
          $(btn.getAttribute('aria-controls')).hidden = open;
        });
      });

      $('table').classList.add('reveal');
    }

    function renderPrizes(league) {
      $('prizes').innerHTML = league.prizes
        ? '<div class="prize gold"><span class="rank">1</span><p>' + esc(league.prizes.first) + '</p></div>' +
          '<div class="prize silver"><span class="rank">2</span><p>' + esc(league.prizes.second) + '</p></div>'
        : '<p class="teaser">Was es zu gewinnen gibt, verraten wir einen Monat nach dem Anpfiff.</p>';
    }

    function fmt(n) {
      return String(n).replace('.', ',');
    }

    function renderRules(league) {
      $('rules').innerHTML = league.disciplines.map(function (d) {
        var tiers = d.tiers.map(function (t) {
          return '<li><b>' + t.points + '</b>ab ' + fmt(t.min) + (d.unit === '%' ? ' %' : d.unit === 'Sterne' ? ' ★' : ' €') + '</li>';
        }).join('');
        var tip = league.tips && league.tips[d.key];
        return '<article class="rule"><h3>' + esc(d.label) + '</h3><ul class="tiers" aria-label="Punkte-Stufen">' + tiers + '</ul>' +
          (tip ? '<p>' + esc(tip) + '</p>' : '') + '</article>';
      }).join('');
    }

    function renderHistory(league) {
      var months = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
      var best = months.map(function (_, m) {
        return Math.max.apply(null, league.teams.map(function (t) { return t.months[m] ? t.months[m].points : -1; }));
      });
      var head = '<thead><tr><th scope="col">Standort</th>' + months.map(function (m) { return '<th scope="col">' + m + '</th>'; }).join('') + '</tr></thead>';
      var body = '<tbody>' + league.teams.map(function (t) {
        return '<tr><th scope="row">' + esc(t.name) + '</th>' + months.map(function (_, m) {
          var month = t.months[m];
          if (!month) return '<td class="empty">–</td>';
          return '<td' + (month.points === best[m] && month.points > 0 ? ' class="best"' : '') + '>' + month.points + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody>';
      $('history').innerHTML = head + body;
    }

    function render(league) {
      renderHeader(league);
      renderTable(league);
      renderPrizes(league);
      renderRules(league);
      renderHistory(league);
      $('league').hidden = false;
    }

    function showLogin(failed) {
      $('status').hidden = true;
      $('login').hidden = false;
      $('login-error').hidden = !failed;
      $('password').focus();
    }

    function load(password) {
      $('status').hidden = false;
      $('status').textContent = 'Tabelle wird geladen …';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            storePassword('');
            showLogin(Boolean(password));
            return;
          }
          storePassword(password);
          $('login').hidden = true;
          $('status').hidden = true;
          render(res.league);
        })
        .withFailureHandler(function () {
          $('status').textContent = 'Die Tabelle konnte nicht geladen werden. Lade die Seite neu.';
        })
        .getLeague(password);
    }

    $('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      load($('password').value);
    });

    var saved = storedPassword();
    if (saved) load(saved); else showLogin(false);
  })();
</script>

  </body>
</html>
